name: Promote release

# Publishes an already signed, staged release to main — the location all
# resort sites read for updates. Run after the staged ZIP was installed and
# checked on the test property. Re-verifies the signature before publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to all sites (e.g. 2.4.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium

      - name: Download the staged release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          mkdir -p staged
          gh release download "v$VERSION" --dir staged --pattern matova-hbook-api.zip --pattern update.json

      - name: Verify exactly as a site would
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .version staged/update.json)" = "$VERSION"
          test "$(jq -r .sha256 staged/update.json)" = "$(sha256sum staged/matova-hbook-api.zip | cut -d' ' -f1)"
          php -r '
            define("ABSPATH", "/x/"); class WP_Error {}
            require "src/matova-hbook-api/includes/class-mha-updater.php";
            $msg = MHA_Updater::signed_message($argv[1], file_get_contents("staged/matova-hbook-api.zip"));
            exit(MHA_Updater::signature_trusted($msg, $argv[2]) ? 0 : 1);
          ' "$VERSION" "$(jq -r .signature staged/update.json)" \
            || { echo "::error::signature does not verify"; exit 1; }

      - name: Publish ZIP + manifest to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          git config user.name "matova-release"
          git config user.email "release@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish origin/main
          git checkout "$TAG_SHA" -- src
          cp staged/matova-hbook-api.zip staged/update.json .
          git add matova-hbook-api.zip update.json src
          git commit -m "Release $VERSION (signed)"
          git push origin publish:main
          gh release edit "v$VERSION" --prerelease=false --title "$VERSION (signed)"
