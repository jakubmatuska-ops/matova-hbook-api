name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: php src/matova-hbook-api/tests/run.php
      - run: node --test tools/rollout.test.mjs
      - name: PHP syntax
        run: find src -name '*.php' -not -path '*/.wproot/*' -print0 | xargs -0 -n1 php -l > /dev/null
