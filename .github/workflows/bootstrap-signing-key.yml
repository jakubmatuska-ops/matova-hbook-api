name: Bootstrap signing key

# One-time: asks the managed signer to create the release-signing key inside
# the Vault (no-op if it exists) and opens a pull request that writes the
# PUBLIC key into the plugin source. No secret is stored or shown anywhere.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  SIGNER_URL: https://czjkwoyjpmyupcshwslu.supabase.co/functions/v1/plugin-release-sign
  AUDIENCE: matova-plugin-release

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create key if missing, read the public key
        id: key
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          PUB=$(curl -fsS -X POST "$SIGNER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"action":"init"}' | jq -r '.public_keys.current // empty')
          [[ "$PUB" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "::error::signer returned no public key"; exit 1; }
          echo "pub=$PUB" >> "$GITHUB_OUTPUT"

      - name: Write the public key into the source and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PUB: ${{ steps.key.outputs.pub }}
        run: |
          set -euo pipefail
          F=src/matova-hbook-api/includes/class-mha-updater.php
          if grep -qF "const PUBKEY_B64 = '$PUB';" "$F"; then echo "Source already trusts this key."; exit 0; fi
          sed -i -E "s#const PUBKEY_B64 = '[^']*';#const PUBKEY_B64 = '$PUB';#" "$F"
          grep -qF "const PUBKEY_B64 = '$PUB';" "$F"
          git config user.name "matova-release"
          git config user.email "release@users.noreply.github.com"
          BR="signing-key-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BR"
          git commit -am "Trust the managed release-signing public key"
          git push origin "$BR"
          gh pr create --title "Trust the managed release-signing public key" \
            --body "Sets PUBKEY_B64 to the public key of the managed signer. Public value only." --base "${{ github.ref_name }}"
